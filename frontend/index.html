<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário de Tarefas</title>
  <link rel="icon" href="data:image/svg+xml,<svg ...><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> 

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lay.css">
  <link rel="stylesheet" href="css/tafefa.css">
  <link rel="stylesheet" href="css/calendario.css">
  <link rel="stylesheet" href="css/kanban.css">

</head>
<body>

    <div id="toast-container" class="toast-container"></div>
    <div id="auth-shell" class="auth-shell"></div>

    <div id="app-shell" class="app-shell hidden">

    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__title">Calendário de Tarefas</span>
      </div>

      <div class="topbar__search">
        <span class="topbar__search-icon">🔎</span>
        <input type="search" id="search-input" placeholder="Buscar tarefas pelo título…" />
      </div>

      <div class="topbar__user">
        <span id="current-username" class="topbar__username"></span>
        <button id="logout-btn" class="btn btn--ghost btn--small">Sair</button>
      </div>
    </header>

    <div class="app-body">
      <nav class="sidebar">
        <button class="sidebar__icon" data-nav="calendar" title="Calendário">
          <span class="sidebar__icon-glyph">📅</span>
          <span class="sidebar__icon-label">Calendário</span>
        </button>
        <button class="sidebar__icon" data-nav="tasks" title="Minhas Tarefas">
          <span class="sidebar__icon-glyph">📝</span>
          <span class="sidebar__icon-label">Tarefas</span>
        </button>
        <button class="sidebar__icon" data-nav="kanban" title="Kanban">
          <span class="sidebar__icon-glyph">🗂️</span>
          <span class="sidebar__icon-label">Kanban</span>
        </button>
        <button class="sidebar__icon" data-nav="dashboard" title="Dashboard">
          <span class="sidebar__icon-glyph">📊</span>
          <span class="sidebar__icon-label">Dashboard</span>
        </button>
      </nav>

      <main id="content" class="content"></main>
    </div>

      <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
